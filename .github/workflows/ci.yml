name: CI

on:
  push:
  pull_request:
  # `pip install esphome` in firmware-build is deliberately unpinned, so this
  # workflow doubles as an upstream-compatibility check. Without a schedule it
  # only ever ran on push, meaning a new ESPHome release could break the
  # component silently until the next commit. Nightly (odd minute, to avoid the
  # top-of-hour cron backlog on GitHub's side) catches it on release day.
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch: {}

jobs:
  host-tests:
    # `ubuntu-latest` migrates to Ubuntu 26.04 between 2026-10-19 and 2026-11-19
    # (actions/runner-images#14748). This job is the only one whose result the
    # image can actually change: it compiles tests/host/test_core.cpp with the
    # runner's own g++, while firmware-build pins Python via setup-python and
    # lets ESPHome bring its own toolchain. So the new image is tested here and
    # not there - doubling eight firmware builds would cost a lot to learn
    # nothing.
    #
    # continue-on-error on purpose, and only until the migration completes: a
    # red badge would say the component is broken, when what it would mean is
    # that an image nobody is on yet behaves differently. Drop both this and the
    # matrix entry once `ubuntu-latest` is 26.04 - at that point the plain entry
    # covers it.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, "ubuntu-26.04"]
    name: host tests (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.runner == 'ubuntu-26.04' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Python syntax check
        run: python -m py_compile components/wmbus_radio/__init__.py

      # The commented options in the examples and the "Domyślnie" column of the
      # reference tables are documentation of the schema; this holds them to it,
      # so a changed default cannot leave ten example files quietly lying.
      - name: Documented defaults match the schema
        run: python tests/ci/check_example_defaults.py

      - name: Build host parser tests
        run: |
          mkdir -p build
          g++ -std=c++17 -Wall -Wextra -Wno-unused-variable \
            -Itests/host \
            -Icomponents/wmbus_radio \
            tests/host/test_core.cpp \
            components/wmbus_radio/decode3of6.cpp \
            components/wmbus_radio/packet.cpp \
            -o build/test_core

      - name: Run host parser tests
        run: ./build/test_core

  firmware-build:
    # Compile the real ESPHome firmware against THIS checkout for every
    # board/chip/core-count variant, so a change that builds on the host but
    # breaks a target (or a specific core count) is caught here.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CC1101 / esp32-c3 (single-core)
            config: examples/CC1101/CC1101_clean.yaml
          - name: SX1262 / esp32-s3 (dual-core)
            config: examples/SX1262/Heltec V3/SX1262_Heltec_V3_clean.yaml
          - name: SX1262 / esp32-s3 R8 (KCT8103L FEM, HW-untested)
            config: examples/SX1262/Heltec V4-R8/SX1262_Heltec_V4R8_clean.yaml
          - name: SX1276 / esp32 (dual-core)
            config: examples/SX1276/HeltecV2/SX1276_Heltec_V2_clean.yaml
          # Wio-SX1262 on XIAO: the only board that needs rf_sw_pin, so this is
          # also the only entry that compiles that option.
          - name: SX1262 / XIAO esp32-s3 (Wio-SX1262, rf_sw_pin)
            config: examples/SX1262/XIAO ESP32 S3/xiao_esp32_s3_clean.yaml
          # LR1121: the driver is behind a compile gate (USE_WMBUS_RADIO_LR1121)
          # and no other config selects it, so without this entry the file is
          # never compiled anywhere - not on anyone's board, not here. A driver
          # nobody can build is worse than one that fails loudly. Same reasoning
          # as the V4-R8 entry above: hardware-untested, compile-covered.
          - name: LR1121 / esp32-s3 (Waveshare HF, HW-untested)
            config: examples/LR1121/Waveshare ESP32-S3-LR1121-HF/LR1121_Waveshare_HF_clean.yaml
          # Not a board variant: this one exists to put forward_meters through
          # real ESPHome validation. The examples never set it, so without this
          # entry only the default (empty) path is ever compiled.
          - name: forward_meters schema (SX1276 / esp32)
            config: tests/ci/forward_meters_ci.yaml
          # The bench transmitter under tests/tools/. Same argument as the
          # LR1121 entry: no other configuration selects wmbus_tx, so without
          # this it is compiled nowhere. It lived outside version control until
          # 2026-09-23 and collected two defects in the dark - a clock loop that
          # could spin without feeding the watchdog, and a C1 mode that never
          # emitted the mode-C indicator. This entry compiles both the
          # diagnostics path and mode c1.
          - name: wmbus_tx bench transmitter (SX1276 / esp32)
            config: tests/tools/wmbus_tx/check.yaml

    name: build (${{ matrix.name }})

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache PlatformIO and ESPHome
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ matrix.config }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.config }}-
            pio-${{ runner.os }}-

      - name: Install ESPHome
        run: pip install esphome

      - name: Prepare config (local component + dummy secrets)
        env:
          CONFIG: ${{ matrix.config }}
        run: |
          # Copy the example into a space-free working dir: PlatformIO (the build
          # backend ESPHome calls for esp-idf) rejects any project path containing
          # whitespace, and some example dirs are named e.g. "Heltec V3".
          mkdir -p ci-build
          flat="ci-build/$(basename "$CONFIG")"
          cp "$CONFIG" "$flat"
          # Dummy secrets so config validation passes (compile-only, never flashed).
          cat > ci-build/secrets.yaml <<'EOF'
          wifi_ssid: "ci-build"
          wifi_password: "ci-build-password"
          mqtt_broker: "127.0.0.1"
          mqtt_user: "ci"
          mqtt_password: "ci"
          EOF
          # Build the component from THIS checkout, not the published github repo.
          sed -i "s|github://Kustonium/esphome-wmbus-bridge-rawonly@main|{ type: local, path: ${GITHUB_WORKSPACE}/components }|" "$flat"
          # 'refresh' is only valid for a git source; drop it for the local override.
          sed -i "/refresh: 0s/d" "$flat"
          # tests/tools/ configs point at their own component directory with a
          # path relative to the config, which the copy above flattens. Absolute
          # it. No-op elsewhere: the rewrite just done yields an absolute path,
          # so this pattern cannot match it.
          sed -i "s|path: components$|path: ${GITHUB_WORKSPACE}/tests/tools/wmbus_tx/components|" "$flat"
          echo "FLAT_CONFIG=$flat" >> "$GITHUB_ENV"
          echo "----- effective external_components -----"
          grep -n -A2 "external_components" "$flat"

      - name: Compile firmware
        run: esphome compile "$FLAT_CONFIG"
