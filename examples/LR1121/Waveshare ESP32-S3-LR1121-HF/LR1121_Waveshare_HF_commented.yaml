# SPDX-License-Identifier: GPL-3.0-or-later
# =============================================================================
# Waveshare ESP32-S3-LR1121-HF (SKU 34011) - wM-Bus T1/C1 receiver
# =============================================================================
#
# STATUS: RECEIVING, AS OF 2026-08-19. Still young, no longer theoretical.
#
# The driver was written from the LR1121 datasheet (Rev 2.1), the board
# schematic, the RichWave RTC6603SP datasheet and the Waveshare resource
# package, with no board on the desk. It has since decoded real telegrams from
# real meters on this exact hardware: BMT and NES devices, 17 good frames per
# minute, RSSI -57..-96 dBm, no truncations.
#
# What that does and does not mean:
#   * The RF chain works end to end - switch table, calibration, GFSK setup,
#     RSSI, the fixed-length capture and the 3-of-6 host decode.
#   * C1 works too: one C1 A frame decoded alongside the T1 traffic.
#   * S1 works as well - 85 bytes decoded from a bench transmitter, no streaming
#     capture needed. Details at listen_mode below.
#   * It has NOT run for days, S1 sensitivity at the margin is unmeasured, and
#     no attempt has been made to compare its yield against an SX1262 in the
#     same position.
#
# Two things that will still bite a newcomer: (1) tcxo_voltage and (2) which
# antenna socket you plugged into. Both are covered below.
#
# -----------------------------------------------------------------------------
# BOARD
# -----------------------------------------------------------------------------
# MCU:     ESP32-S3, 4 MB flash, 2 MB PSRAM
# Radio:   Semtech LR1121, TCXO on board
# USB:     Type-C, wired straight to the ESP32-S3 native USB pins. No serial
#          bridge chip - see the logger note below or the board stays mute.
#
# ANTENNA SOCKETS - CHECK THIS BEFORE ANYTHING ELSE.
# The board carries more than one u.FL socket and they are not interchangeable:
# one belongs to the ESP32's own WiFi front end, one to the LR1121's 2.4 GHz
# port, and only one to the sub-GHz path through the RF switch. An antenna in
# the wrong socket produces perfect silence with no error anywhere - identical
# to a broken radio. Five minutes with a magnifier saves half a day.
#
# PINOUT (Waveshare wiki, src/wavesahre_lora_1121.h - the typo is theirs, and
# confirmed against the schematic netlist):
#   RESET GPIO39   MOSI GPIO45   MISO GPIO46   SCK GPIO40
#   CS    GPIO42   BUSY GPIO41   IRQ  GPIO38
#
# GPIO45 and GPIO46 are ESP32-S3 strapping pins (VDD_SPI and boot mode). This
# is expected to be harmless because the LR1121 releases MISO while CS is high
# (datasheet 3.6.3), but if the board ever refuses to boot, suspect these first.
# =============================================================================

substitutions:
  devicename: wmbus-lr1121
  friendly_name: "wMBus Bridge LR1121"

esphome:
  name: ${devicename}
  friendly_name: ${friendly_name}
  min_version: 2026.1.3

esp32:
  variant: esp32s3
  # 4 MB, with no 8/16 MB variant of this board. ESPHome with OTA fits, but
  # there is less headroom than on an N16R8 - if a build overflows, the
  # partition layout is the first thing to look at, not the component.
  flash_size: 4MB
  cpu_frequency: 160MHz
  framework:
    # esp-idf, not arduino. The component refuses arduino unless you opt in,
    # because nothing here is built or tested against it.
    type: esp-idf

external_components:
  - source: github://Kustonium/esphome-wmbus-bridge-rawonly@main
    components: [wmbus_radio]
    refresh: 0s

logger:
  # REQUIRED on this board, and the first thing to suspect if it comes up mute.
  #
  # The USB-C runs straight into the ESP32-S3's own USB pins (GPIO19/GPIO20,
  # chip pins 25/26, through series resistors to the J3 header). There is no
  # CP2102/CH340 on this board. ESPHome's default logger UART goes to pins that
  # are not brought out here, so the default config produces a board that boots,
  # works, and says nothing - which looks exactly like a board that is dead.
  #
  # Confirmed twice: the schematic netlist, and the vendor's own Meshtastic
  # platformio.ini in the same package, which sets ARDUINO_USB_MODE=1 plus
  # ARDUINO_USB_CDC_ON_BOOT=1 for the same reason.
  #
  # If USB_SERIAL_JTAG turns out not to enumerate, USB_CDC is the other
  # peripheral sharing those two pins - try that before suspecting hardware.
  hardware_uart: USB_SERIAL_JTAG
  # Raise to debug while bringing the board up: the driver logs the chip
  # version and the decoded boot errors, which is where a wrong tcxo_voltage
  # shows up.
  level: info
  logs:
    mqtt: warn
    component: warn

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_user
  password: !secret mqtt_password
  port: 1883
  skip_cert_cn_check: true

api:
  # Keep the Native API available (Home Assistant, esphome logs, OTA over API)
  # but do NOT let it reboot the board.
  #
  # Why: ESPHome defaults to reboot_timeout: 15min, and that timer restarts the
  # device when no Native API CLIENT is connected. A board that only publishes
  # to MQTT usually has no such client, so it reboots every 15 minutes forever.
  # That was measured here on 2026-08-20/21: the RX metadata showed 51 distinct
  # boot_id values per board in a single night, median 900 s between starts,
  # while Home Assistant had no ESPHome device added at all. After setting 0s
  # the same boards ran 14.1 h with one boot_id and a continuously rising seq.
  #
  # This is NOT mqtt.reboot_timeout - that one reacts to losing the broker and
  # is a separate decision. Leave it alone unless you have measured a broker
  # problem.
  reboot_timeout: 0s
ota:
  - platform: esphome
# Reception timestamp: SNTP first, HA time as a fallback. If only
# `homeassistant` is listed and HA API is not connected, the clock
# never gets set and /rx frames go out without `received_at` - the
# add-on then reports "no timestamp" indefinitely. SNTP works from
# WiFi alone, so it recovers frames even before HA sees the board.
time:
  - platform: sntp
    id: sntp_time
    servers:
      - pl.pool.ntp.org
      - 0.pool.ntp.org
  - platform: homeassistant
    id: ha_time

# Device telemetry, same block the XIAO example carries. These become Home
# Assistant entities, which is what makes them reach InfluxDB and Grafana - the
# wmbus diagnostics themselves go out over MQTT topics instead
# (wmbus/<topic_name>/diag/...), so the two feeds are separate on purpose.
#
# Note for InfluxDB: the measurement name comes from the entity's unit, so
# Uptime lands in `s` and WiFi RSSI in `dBm`. The two text_sensors have no unit
# and fall back to entity_id - fine for a status panel, useless for a graph.
sensor:
  - platform: uptime
    name: "Uptime"
  - platform: wifi_signal
    name: "WiFi RSSI"
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "WiFi SSID"

spi:
  clk_pin: GPIO40
  miso_pin: GPIO46
  mosi_pin: GPIO45

wmbus_radio:
  radio_type: LR1121

  # Deliberate speed bump. Same idea as cc1101_allow_experimental: an unverified
  # radio should not be reachable by copying a config off a forum.
  lr1121_allow_experimental: true

  cs_pin: GPIO42
  reset_pin: GPIO39
  irq_pin:
    number: GPIO38
    mode: input

  # Mandatory on this chip, unlike SX1276. Every command is framed by the BUSY
  # handshake: NSS falling raises BUSY, and BUSY falling means "ready for the
  # next one". Reads are two transactions with a BUSY wait between them. Without
  # this pin the driver cannot tell "not ready yet" from "answered".
  busy_pin: GPIO41

  # both = alternate the C-mode sync bytes 3:1 in favour of Format A (0x3D)
  # while still catching Format B (0xCD). t1 pins it to 0x3D.
  #
  # MEASURED 2026-08-19 in `both`: T1 from BMT, NES and Techem, and one C1 A
  # frame (Techem) - so the 3:1 sync-word cycling does catch C-mode on this
  # chip. One frame is proof the path works, not a yield figure; C1 is rare at
  # this location, and Format B (0xCD) has still never been seen here.
  #
  # s1 WORKS, measured 2026-08-19 against a bench transmitter: Format A frame,
  # 85 bytes decoded out of a 255-byte capture, RSSI -59 dBm, three sent and
  # three received. The mode sets 32768 b/s and sync 0x54 0x76 0x96 (24 bits)
  # on top of the 868.300 MHz that listen_mode already selects.
  #
  # No streaming capture was needed: RX_DONE fires against the fixed length and
  # the host trims, exactly as it does for T1. The SX1262 S1 path uses
  # SYNC_WORD_VALID because it needs to know when to stop a stream - this driver
  # does not stream, so it does not need to know.
  #
  # What is NOT established: sensitivity at the margin. The bench signal was
  # strong. A weak real S1 transmitter is a different test.
  listen_mode: both  # pinned: kept explicit while this radio is new

  # ---------------------------------------------------------------------------
  # TCXO SUPPLY - THE OPEN QUESTION ON THIS BOARD
  # ---------------------------------------------------------------------------
  # The vendor package contradicts itself. All thirteen C example files set
  # 3.0 V; the Meshtastic variant in the same package sets 1.8 V. Neither is a
  # measurement of the part actually fitted: the 3.0 V value is traceable to
  # Semtech's reference shield source (which fills the field even for a shield
  # declared as having no TCXO at all), and the 1.8 V file carries comments
  # about a different board entirely. The schematic labels Y2 only as
  # "SMD TCXO 32 MHz (2.0x1.6)".
  #
  # The driver originally defaulted to the LOW value, because the failure modes
  # are not symmetric:
  #   too low  -> the oscillator does not start, and the chip says so with
  #               HF_XOSC_START. Loud, harmless, fixable by editing one line.
  #   too high -> it starts anyway, out of spec, silently, and you find out
  #               months later as frequency drift.
  # That ordering is what identified 3.0 V as the working value in a single
  # boot, without a multimeter. The default is now 3.0 V because it is measured;
  # the reasoning is kept because it is how the answer was reached.
  #
  # MEASURED on this board, 2026-08-19: at 3.0 V the receiver decodes real BMT
  # and NES telegrams (17 good frames per minute, RSSI -57..-96 dBm). At 1.8 V
  # it did not run.
  #
  # EXPECT HF_XOSC_START IN THE BOOT LOG ANYWAY, AND DO NOT CHASE IT.
  # The flag is latched while entering STDBY_XOSC, but both calibrations that
  # follow come back clean (IMAGE=0x0000 ALL=0x0000) and reception works - so
  # the reference is running and the bit is a startup transient, not a fault.
  # The stage line in the boot report exists precisely to tell those apart:
  #   Calibration stages: XOSC=0x0020 IMAGE=0x0000 ALL=0x0000   <- fine
  # If IMAGE or ALL are also non-zero, that is a real dead clock, and only then
  # are these two options worth changing.
  tcxo_voltage: "3.0v"
  tcxo_startup_ticks: 3000  # ~91.6 ms, in 32.768 kHz ticks - not milliseconds

  # T1 is fixed-length at the packet engine because its L-field is 3-of-6
  # encoded and cannot be used by the radio as an on-air length byte. Capture
  # the maximum single-packet length (255 bytes) and let the host trim it. A
  # real L=0x4C meter needs about 134 encoded bytes, so the former value 128
  # truncated valid telegrams. Frames exceeding 255 encoded bytes will require
  # a streaming FIFO path analogous to the SX1262 long-frame receiver.
  payload_length: 255

  # ---------------------------------------------------------------------------
  # RF PARAMETERS
  # ---------------------------------------------------------------------------
  # Defaults are wM-Bus T1/C1 and should not need touching. They are options
  # rather than constants on purpose: the measurements behind them come from one
  # dense environment, and someone with three meters in a detached house is in a
  # different situation. Hardcoding a neighbour's optimum is exactly the mistake
  # this project criticises elsewhere.

  # 868.950 MHz for T1/C1. S1 defaults to 868.300 when listen_mode is s1.
  frequency: 868.950

  # 100 kb/s chip rate, 50 kHz deviation -> modulation index 1.0.
  bitrate: 100000  # measured on the 2026-08-19 receiving run
  deviation: 50000  # measured on the 2026-08-19 receiving run

  # Receiver bandwidth, double sideband. The signal needs 2*fdev + bitrate =
  # 200 kHz, so 234300 is the tightest usable step and lets in the least noise.
  # Widen to 312000 only if meters are missed in a way that looks like they sit
  # off channel - the spectrum, not the guess, should decide that.
  rx_bandwidth: "234300"  # measured on the 2026-08-19 receiving run

  # Preamble detector length in bits. Shorter catches weaker signals and fires
  # more often on noise; longer is the opposite. 16 is the compromise.
  preamble_detector: "16"  # measured on the 2026-08-19 receiving run

  # payload_length is set once, further up. It used to be repeated here with a
  # different value (128), and since a later YAML key wins, this example would
  # silently have run at 128 - truncating every NES telegram, which arrives as
  # 245 raw bytes. Do not reintroduce a second copy.

  # +2 dB sensitivity for about 2 mA. On USB power there is no reason to say no.
  rx_boosted: true  # measured: on during the 2026-08-19 receiving run

  topic_name: wmbus

  # EN: Publish the last measured RSSI for each forwarded meter as a retained
  #     integer at wmbus/<topic_name>/rssi/<meter_id>. Frames without a real
  #     RSSI measurement are skipped, so no placeholder value is ever sent.
  #     The wMBus MQTT Bridge add-on turns it into one signal-strength entity
  #     per receiving board, which is how two boards can be compared.
  # PL: Publikuj ostatnie zmierzone RSSI każdego przekazanego licznika jako
  #     zachowaną liczbę całkowitą na wmbus/<topic_name>/rssi/<meter_id>.
  #     Ramki bez rzeczywistego pomiaru są pomijane, więc żadna wartość
  #     zastępcza nie jest wysyłana. Dodatek wMBus MQTT Bridge robi z tego
  #     osobną encję siły sygnału dla każdej płytki, co pozwala je porównać.
  # publish_rssi: true  # default: false
