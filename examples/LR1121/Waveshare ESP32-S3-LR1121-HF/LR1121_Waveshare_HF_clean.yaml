# SPDX-License-Identifier: GPL-3.0-or-later
#
# Waveshare ESP32-S3-LR1121-HF (SKU 34011) - wM-Bus T1/C1 receiver.
#
# Receiving real meters as of 2026-08-19 (BMT + NES, T1). Read
# LR1121_Waveshare_HF_commented.yaml first - especially the tcxo_voltage note
# (HF_XOSC_START in the boot log is expected and harmless here) and the warning
# about which antenna socket is the sub-GHz one.

substitutions:
  devicename: wmbus-lr1121
  friendly_name: "wMBus Bridge LR1121"

esphome:
  name: ${devicename}
  friendly_name: ${friendly_name}
  min_version: 2026.1.3

esp32:
  variant: esp32s3
  flash_size: 4MB
  cpu_frequency: 160MHz
  framework:
    type: esp-idf

external_components:
  - source: github://Kustonium/esphome-wmbus-bridge-rawonly@main
    components: [wmbus_radio]
    refresh: 0s

logger:
  # REQUIRED on this board. The USB-C goes straight to the ESP32-S3's native USB
  # pins - there is no serial bridge chip. ESPHome's default logger UART is not
  # wired to anything reachable here, so without this line the board is silent.
  hardware_uart: USB_SERIAL_JTAG
  level: info
  logs:
    mqtt: warn
    component: warn

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_user
  password: !secret mqtt_password
  port: 1883
  skip_cert_cn_check: true

api:
  # A standalone MQTT receiver must not reboot because no Native API client is
  # connected. ESPHome's default is reboot_timeout: 15min, which restarted these
  # boards every 15 minutes (measured 2026-08-20/21: 51 distinct boot_id per
  # board in one night, median 900 s apart). 0s disables that watchdog only -
  # Native API and time: platform: homeassistant keep working.
  reboot_timeout: 0s
ota:
  - platform: esphome
time:
  - platform: homeassistant

sensor:
  - platform: uptime
    name: "Uptime"
  - platform: wifi_signal
    name: "WiFi RSSI"
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "WiFi SSID"

spi:
  clk_pin: GPIO40
  miso_pin: GPIO46
  mosi_pin: GPIO45

wmbus_radio:
  radio_type: LR1121
  lr1121_allow_experimental: true
  cs_pin: GPIO42
  reset_pin: GPIO39
  busy_pin: GPIO41
  irq_pin:
    number: GPIO38
    mode: input
  listen_mode: both
  tcxo_voltage: "3.0v"
  tcxo_startup_ticks: 3000
  payload_length: 255
  diagnostic_mode: normal
