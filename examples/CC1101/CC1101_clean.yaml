substitutions:
  devicename: esphome-wmbus-cc1101
  friendly_name: "wMBus Bridge CC1101"

esphome:
  name: ${devicename}
  friendly_name: ${friendly_name}
  min_version: 2026.1.3
  name_add_mac_suffix: false

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

external_components:
  - source: github://Kustonium/esphome-wmbus-bridge-rawonly@main
    components: [wmbus_radio]
    refresh: 0s

logger:
  level: info
  logs:
    mqtt: warn
    component: warn

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_user
  password: !secret mqtt_password
  # EN: plain MQTT on 1883; don't enable TLS unless your broker has a valid cert
  #     (a wrong/unknown cert blocks the ESP from connecting).
  # PL: zwykłe MQTT na 1883; nie włączaj TLS bez pewności co do certu brokera
  #     (zły/nieznany cert blokuje połączenie ESP).
  port: 1883
  skip_cert_cn_check: true

api:
  # A standalone MQTT receiver must not reboot because no Native API client is
  # connected. ESPHome's default is reboot_timeout: 15min, which restarted these
  # boards every 15 minutes (measured 2026-08-20/21: 51 distinct boot_id per
  # board in one night, median 900 s apart). 0s disables that watchdog only -
  # Native API and time: platform: homeassistant keep working.
  reboot_timeout: 0s
ota:
  - platform: esphome
mdns:
  disabled: false
# Reception timestamp: SNTP first, HA time as a fallback. If only
# `homeassistant` is listed and HA API is not connected, the clock
# never gets set and /rx frames go out without `received_at` - the
# add-on then reports "no timestamp" indefinitely. SNTP works from
# WiFi alone, so it recovers frames even before HA sees the board.
time:
  - platform: sntp
    id: sntp_time
    servers:
      - pl.pool.ntp.org
      - 0.pool.ntp.org
  - platform: homeassistant
    id: ha_time

spi:
  clk_pin: GPIO5
  mosi_pin: GPIO6
  miso_pin: GPIO7

wmbus_radio:
  radio_type: CC1101
  cc1101_allow_experimental: true

  frequency: 868.950
  cs_pin: GPIO4

  gdo0_pin:
    number: GPIO3
    mode: input

  gdo2_pin:
    number: GPIO2
    mode: input

  listen_mode: t1
  listen_mode_filter_after_parse: false

  topic_name: "cc1101"
  diagnostic_mode: normal
  diagnostic_summary_interval: 60s
