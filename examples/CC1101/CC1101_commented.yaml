# =============================================================================
# ESPHome wM-Bus Bridge RAW-only / CC1101 EXPERIMENTAL
# EN: Commented example for advanced/testing use.
# PL: Przykład z komentarzami do zastosowań zaawansowanych/testowych.
#
# EN: Data path:
#     radio -> component validation -> MQTT -> wmbusmeters -> JSON/HA entities
# PL: Tor danych:
#     radio -> walidacja w komponencie -> MQTT -> wmbusmeters -> JSON/encje HA
#
# EN: CC1101 support is experimental and requires explicit opt-in.
#     This component intentionally requires two lines: GDO2 + GDO0.
#     Single-IRQ CC1101 wiring is not supported.
# PL: Obsługa CC1101 jest eksperymentalna i wymaga jawnego włączenia.
#     Komponent celowo wymaga dwóch linii: GDO2 + GDO0.
#     Konfiguracja CC1101 z jednym IRQ nie jest obsługiwana.
# =============================================================================

substitutions:
  devicename: esphome-wmbus-cc1101
  friendly_name: "wMBus Bridge CC1101"

esphome:
  name: ${devicename}
  friendly_name: ${friendly_name}
  min_version: 2026.1.3
  name_add_mac_suffix: false

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

external_components:
  - source: github://Kustonium/esphome-wmbus-bridge-rawonly@main
    components: [wmbus_radio]
    refresh: 0s

logger:
  level: info
  logs:
    mqtt: warn
    component: warn
    wmbus: info

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_user
  password: !secret mqtt_password
  # EN: plain MQTT on 1883; don't enable TLS unless your broker has a valid cert
  #     (a wrong/unknown cert blocks the ESP from connecting).
  # PL: zwykłe MQTT na 1883; nie włączaj TLS bez pewności co do certu brokera
  #     (zły/nieznany cert blokuje połączenie ESP).
  port: 1883
  skip_cert_cn_check: true

  # EN: Optional ESPHome logs over MQTT. For first CC1101 tests, USB/API logs are usually clearer.
  # PL: Opcjonalne logi ESPHome przez MQTT. Przy pierwszych testach CC1101 zwykle lepszy jest log USB/API.
  # log_topic:
  #   topic: "${devicename}/debug"
  #   level: DEBUG

api:
  # Keep the Native API available (Home Assistant, esphome logs, OTA over API)
  # but do NOT let it reboot the board.
  #
  # Why: ESPHome defaults to reboot_timeout: 15min, and that timer restarts the
  # device when no Native API CLIENT is connected. A board that only publishes
  # to MQTT usually has no such client, so it reboots every 15 minutes forever.
  # That was measured here on 2026-08-20/21: the RX metadata showed 51 distinct
  # boot_id values per board in a single night, median 900 s between starts,
  # while Home Assistant had no ESPHome device added at all. After setting 0s
  # the same boards ran 14.1 h with one boot_id and a continuously rising seq.
  #
  # This is NOT mqtt.reboot_timeout - that one reacts to losing the broker and
  # is a separate decision. Leave it alone unless you have measured a broker
  # problem.
  reboot_timeout: 0s
ota:
  - platform: esphome
mdns:
  disabled: false
# Reception timestamp: SNTP first, HA time as a fallback. If only
# `homeassistant` is listed and HA API is not connected, the clock
# never gets set and /rx frames go out without `received_at` - the
# add-on then reports "no timestamp" indefinitely. SNTP works from
# WiFi alone, so it recovers frames even before HA sees the board.
time:
  - platform: sntp
    id: sntp_time
    servers:
      - pl.pool.ntp.org
      - 0.pool.ntp.org
  - platform: homeassistant
    id: ha_time

# =============================================================================
# SPI BUS / MAGISTRALA SPI – example for ESP32-C3 Super Mini / DevKitM
#
# CC1101        ESP32-C3
# ----------------------
# GND       ->  GND
# VCC       ->  3V3
# GDO0      ->  GPIO3
# CSN       ->  GPIO4
# SCK       ->  GPIO5
# MOSI      ->  GPIO6
# MISO/GDO1 ->  GPIO7
# GDO2      ->  GPIO2
# =============================================================================
spi:
  clk_pin: GPIO5
  mosi_pin: GPIO6
  miso_pin: GPIO7

# =============================================================================
# WMBUS RADIO – CC1101 EXPERIMENTAL
# =============================================================================
wmbus_radio:
  # ─────────────────────────────────────────────────────────────────────────
  # EN: REQUIRED here: radio_type, the board pins (cs/reset/busy/irq — or
  #     gdo0/gdo2 + cc1101_allow_experimental for CC1101), has_tcxo where the
  #     module has a TCXO, and listen_mode. Everything else below is OPTIONAL —
  #     sane defaults apply if you delete it: frequency, rx_gain,
  #     long_gfsk_packets, listen_mode_filter_after_parse, topic_name,
  #     diagnostic_*, highlight_meters and forward_meters.
  # PL: WYMAGANE tutaj: radio_type, piny płytki (cs/reset/busy/irq — lub
  #     gdo0/gdo2 + cc1101_allow_experimental dla CC1101), has_tcxo gdy moduł ma
  #     TCXO, oraz listen_mode. Cała reszta poniżej jest OPCJONALNA — po
  #     usunięciu działają sensowne domyślne: frequency, rx_gain,
  #     long_gfsk_packets, listen_mode_filter_after_parse, topic_name,
  #     diagnostic_*, highlight_meters oraz forward_meters.
  # ─────────────────────────────────────────────────────────────────────────
  radio_type: CC1101

  # EN: Required safety gate. Without this option CC1101 fails validation by design.
  # PL: Wymagana bramka bezpieczeństwa. Bez tej opcji CC1101 celowo nie przejdzie walidacji.
  cc1101_allow_experimental: true

  # EN: Optional frequency override in MHz.
  #     T1/C1/both default: 868.950 MHz.
  #     S1 default: 868.300 MHz.
  #     Keep this only if you intentionally want a fixed/manual value.
  # PL: Opcjonalne ręczne ustawienie częstotliwości w MHz.
  #     Domyślnie T1/C1/both: 868.950 MHz.
  #     Domyślnie S1: 868.300 MHz.
  #     Zostaw tylko wtedy, gdy świadomie chcesz wartość ręczną.
  frequency: 868.950

  cs_pin: GPIO4

  # EN: CC1101 requires both lines:
  #     GDO2 = sync detection / start of telegram,
  #     GDO0 = FIFO threshold / FIFO data event.
  #     Do not use irq_pin/reset_pin/busy_pin for CC1101 in this component.
  # PL: CC1101 wymaga obu linii:
  #     GDO2 = sync detect / początek telegramu,
  #     GDO0 = FIFO threshold / dane w FIFO.
  #     Dla CC1101 w tym komponencie nie używaj irq_pin/reset_pin/busy_pin.
  gdo0_pin:
    number: GPIO3
    mode: input

  gdo2_pin:
    number: GPIO2
    mode: input

  # EN: Receive mode. Available values: t1, c1, both, s1.
  #     both means T1/C1 only. S1 is separate and cannot be combined with T1/C1.
  # PL: Tryb odbioru. Dostępne wartości: t1, c1, both, s1.
  #     both oznacza tylko T1/C1. S1 jest osobny i nie łączy się z T1/C1.
  listen_mode: t1

  # EN: Conservative/stable mode. Set true only for targeted experiments.
  # PL: Tryb konserwatywny/stabilny. Ustaw true tylko do celowych testów.
  # listen_mode_filter_after_parse: false  # default: false

  # EN: New automatic MQTT topic model.
  #     Generated topics:
  #       wmbus/cc1101/telegram
  #       wmbus/cc1101/diag
  #       wmbus/cc1101/diag/summary
  #       wmbus/cc1101/diag/meter_snapshot
  # PL: Nowy automatyczny model topiców MQTT.
  #     Generowane topiki:
  #       wmbus/cc1101/telegram
  #       wmbus/cc1101/diag
  #       wmbus/cc1101/diag/summary
  #       wmbus/cc1101/diag/meter_snapshot
  topic_name: "cc1101"

  # EN: Diagnostic preset. For normal use this gives summary + 15min summary + highlighted meter snapshots.
  # PL: Preset diagnostyczny. Dla normalnej pracy daje summary + summary 15 min + snapshot wyróżnionych liczników.
  diagnostic_mode: normal
  # diagnostic_summary_interval: 60s  # default: 60s

  # EN: Publish the last measured RSSI for each forwarded meter as a retained
  #     integer at wmbus/<topic_name>/rssi/<meter_id>. Frames without a real
  #     RSSI measurement are skipped, so no placeholder value is ever sent.
  #     The wMBus MQTT Bridge add-on turns it into one signal-strength entity
  #     per receiving board, which is how two boards can be compared.
  # PL: Publikuj ostatnie zmierzone RSSI każdego przekazanego licznika jako
  #     zachowaną liczbę całkowitą na wmbus/<topic_name>/rssi/<meter_id>.
  #     Ramki bez rzeczywistego pomiaru są pomijane, więc żadna wartość
  #     zastępcza nie jest wysyłana. Dodatek wMBus MQTT Bridge robi z tego
  #     osobną encję siły sygnału dla każdej płytki, co pozwala je porównać.
  # publish_rssi: true  # default: false

  # EN: Optional selected meters for meter_snapshot in diagnostic_mode: normal.
  # PL: Opcjonalne wyróżnione liczniki do meter_snapshot w diagnostic_mode: normal.
  # highlight_meters:  # default: []
  #   - "12345678"
  #   - "87654321"

  # EN: Optional whitelist — only these meters reach wmbus/<topic_name>/telegram.
  #     Everything else is dropped on the ESP, which is the point in a dense block.
  #     Use `forward_meters: true` instead of a list to reuse highlight_meters above.
  #     Quote hex IDs, otherwise YAML turns 0x417F0666 into the number 1098843750.
  # PL: Opcjonalna whitelista — na wmbus/<topic_name>/telegram trafiają tylko te liczniki.
  #     Reszta jest odrzucana na ESP, o co chodzi w gęstej zabudowie.
  #     Zamiast listy można dać `forward_meters: true` i użyć listy z highlight_meters.
  #     ID szesnastkowe w cudzysłowie, inaczej YAML zamieni 0x417F0666 na 1098843750.
  # forward_meters:  # default: []
  #   - "00088888"
  #   - "0x417F0666"
