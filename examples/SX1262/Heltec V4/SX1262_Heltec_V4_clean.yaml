substitutions:
  devicename: esphome-wmbus-heltec-v4
  friendly_name: "wMBus Bridge Heltec V4"

esphome:
  name: ${devicename}
  friendly_name: ${friendly_name}
  min_version: 2026.1.3
  name_add_mac_suffix: false

esp32:
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 160MHz
  framework:
    type: esp-idf

psram:
  mode: quad

external_components:
  - source: github://Kustonium/esphome-wmbus-bridge-rawonly@main
    components: [wmbus_radio]
    refresh: 0s

logger:
  level: info
  logs:
    mqtt: warn
    component: warn

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_user
  password: !secret mqtt_password
  # EN: plain MQTT on 1883; don't enable TLS unless your broker has a valid cert
  #     (a wrong/unknown cert blocks the ESP from connecting).
  # PL: zwykłe MQTT na 1883; nie włączaj TLS bez pewności co do certu brokera
  #     (zły/nieznany cert blokuje połączenie ESP).
  port: 1883
  skip_cert_cn_check: true

api:
  # A standalone MQTT receiver must not reboot because no Native API client is
  # connected. ESPHome's default is reboot_timeout: 15min, which restarted these
  # boards every 15 minutes (measured 2026-08-20/21: 51 distinct boot_id per
  # board in one night, median 900 s apart). 0s disables that watchdog only -
  # Native API and time: platform: homeassistant keep working.
  reboot_timeout: 0s
ota:
  - platform: esphome
time:
  - platform: homeassistant

spi:
  clk_pin: GPIO9
  mosi_pin: GPIO10
  miso_pin: GPIO11

wmbus_radio:
  radio_type: SX1262
  cs_pin: GPIO8
  reset_pin: GPIO12
  busy_pin: GPIO13
  irq_pin:
    number: GPIO14
    mode: input
  fem_en_pin: GPIO2
  fem_ctrl_pin: GPIO7
  fem_pa_pin: GPIO46
  dio2_rf_switch: true
  has_tcxo: true
  # A TCXO board sets XOSC_START_ERR on every power-up: the chip tries its own
  # crystal before DIO3 is told to power the TCXO, and DIO3 is configured after
  # reset. Clearing it once the reference is up is what the datasheet expects,
  # and it is what makes the flag mean something - one that stays cleared was a
  # boot artefact, one that comes back is a reference that really is not
  # starting. Left off, the flag is always set and reports nothing.
  clear_device_errors_on_boot: true
  publish_dev_err_after_clear: true
  rx_gain: boosted
  long_gfsk_packets: true
  listen_mode: t1
  listen_mode_filter_after_parse: false
  diagnostic_mode: normal
