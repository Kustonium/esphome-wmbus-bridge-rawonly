# ESPHome wM-Bus Bridge RAW-only — Heltec WiFi LoRa 32 V4-R8 / SX1262
# EN: Commented example. Derived from the "Heltec V4" (V4.2) example. R8 uses
#     ESP32-S3R8 (8 MB octal PSRAM) and the KCT8103L front-end (V4.2 = GC1109).
#     Per Heltec's driver (board-config.h / radio.c) the RAW-only receiver delta
#     vs V4.2 is: fem_pa_pin 46 -> 5 and the LED pin 35 -> 46. fem_en/fem_ctrl
#     unchanged. STATUS: validated against Heltec's driver source, NOT yet
#     flashed on physical R8. If it boots but hears nothing at good RSSI,
#     fem_pa_pin is the first suspect (KCT8103L != GC1109).
# PL: Przykład z komentarzami. Pochodzi od przykładu "Heltec V4" (V4.2). R8 to
#     ESP32-S3R8 (8 MB octal PSRAM) i front-end KCT8103L (V4.2 = GC1109). Wg
#     sterownika Helteca delta odbiornika RAW-only vs V4.2 to: fem_pa_pin 46 -> 5
#     oraz pin LED 35 -> 46. fem_en/fem_ctrl bez zmian. STATUS: zgodne ze
#     sterownikiem Helteca, JESZCZE nie flashowane na fizycznym R8. Jak wstanie
#     i nic nie słyszy przy dobrym RSSI — pierwszy podejrzany fem_pa_pin.

substitutions:
  devicename: esphome-wmbus-heltec-v4r8
  friendly_name: "wMBus Bridge Heltec V4-R8"

esphome:
  name: ${devicename}
  friendly_name: ${friendly_name}
  min_version: 2026.1.3
  name_add_mac_suffix: false

esp32:
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 160MHz
  framework:
    type: esp-idf

psram:
  mode: octal  # V4-R8 = ESP32-S3R8, 8 MB octal PSRAM (V4.2 was quad/2 MB)

external_components:
  - source: github://Kustonium/esphome-wmbus-bridge-rawonly@main
    components: [wmbus_radio]
    refresh: 0s

logger:
  level: info
  logs:
    mqtt: warn
    component: warn

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_user
  password: !secret mqtt_password
  # EN: plain MQTT on 1883; don't enable TLS unless your broker has a valid cert
  #     (a wrong/unknown cert blocks the ESP from connecting).
  # PL: zwykłe MQTT na 1883; nie włączaj TLS bez pewności co do certu brokera
  #     (zły/nieznany cert blokuje połączenie ESP).
  port: 1883
  skip_cert_cn_check: true

api:
  # Keep the Native API available (Home Assistant, esphome logs, OTA over API)
  # but do NOT let it reboot the board.
  #
  # Why: ESPHome defaults to reboot_timeout: 15min, and that timer restarts the
  # device when no Native API CLIENT is connected. A board that only publishes
  # to MQTT usually has no such client, so it reboots every 15 minutes forever.
  # That was measured here on 2026-08-20/21: the RX metadata showed 51 distinct
  # boot_id values per board in a single night, median 900 s between starts,
  # while Home Assistant had no ESPHome device added at all. After setting 0s
  # the same boards ran 14.1 h with one boot_id and a continuously rising seq.
  #
  # This is NOT mqtt.reboot_timeout - that one reacts to losing the broker and
  # is a separate decision. Leave it alone unless you have measured a broker
  # problem.
  reboot_timeout: 0s
ota:
  - platform: esphome
mdns:
  disabled: false
improv_serial:
# Reception timestamp: SNTP first, HA time as a fallback. If only
# `homeassistant` is listed and HA API is not connected, the clock
# never gets set and /rx frames go out without `received_at` - the
# add-on then reports "no timestamp" indefinitely. SNTP works from
# WiFi alone, so it recovers frames even before HA sees the board.
time:
  - platform: sntp
    id: sntp_time
    servers:
      - pl.pool.ntp.org
      - 0.pool.ntp.org
  - platform: homeassistant
    id: ha_time

# Optional basic ESP diagnostics.
debug:

spi:
  clk_pin: GPIO9
  mosi_pin: GPIO10
  miso_pin: GPIO11

# Optional status LED on Heltec V4-R8, active-low.
# NOTE: on R8 the LED moved to GPIO46 (on V4.2 it was GPIO35). GPIO46 is exactly
# the pin that used to be FEM_PA on V4.2 — which is why fem_pa_pin below is GPIO5.
output:
  - platform: gpio
    id: led_output
    pin:
      number: GPIO46
      inverted: true

light:
  - platform: binary
    id: status_led
    name: "LED"
    output: led_output
    restore_mode: ALWAYS_OFF

script:
  - id: blink_led
    mode: single
    then:
      - light.turn_on: status_led
      - delay: 50ms
      - light.turn_off: status_led

wmbus_radio:
  # ─────────────────────────────────────────────────────────────────────────
  # EN: REQUIRED here: radio_type, the board pins (cs/reset/busy/irq), has_tcxo
  #     where the module has a TCXO, and listen_mode. Everything else below is
  #     OPTIONAL — sane defaults apply if you delete it.
  # PL: WYMAGANE tutaj: radio_type, piny płytki (cs/reset/busy/irq), has_tcxo gdy
  #     moduł ma TCXO, oraz listen_mode. Cała reszta poniżej jest OPCJONALNA.
  # ─────────────────────────────────────────────────────────────────────────
  radio_type: SX1262
  cs_pin: GPIO8
  reset_pin: GPIO12
  busy_pin: GPIO13
  irq_pin:
    number: GPIO14
    mode: input

  # Heltec V4-R8 external FEM/LNA pins (KCT8103L).
  # EN: POWER=7, CSD=2, CTX=5 per Heltec board-config.h (WIFI_LORA_32_V4_R8).
  #     RX levels (radio.c RadioRx): POWER=HIGH, CSD=HIGH, CTX=LOW — which is
  #     exactly what the driver sets (fem_en/fem_ctrl HIGH, fem_pa LOW).
  # PL: POWER=7, CSD=2, CTX=5 wg board-config.h Helteca (WIFI_LORA_32_V4_R8).
  #     Poziomy RX: POWER=HIGH, CSD=HIGH, CTX=LOW — dokładnie to, co ustawia
  #     sterownik (fem_en/fem_ctrl HIGH, fem_pa LOW).
  fem_en_pin: GPIO2     # KCT8103L CSD (unchanged vs V4.2)
  fem_ctrl_pin: GPIO7   # FEM power / VFEM (unchanged vs V4.2)
  fem_pa_pin: GPIO5     # KCT8103L CTX — was GPIO46 (GC1109 TX_EN) on V4.2

  # dio2_rf_switch: true  # default: true
  has_tcxo: true
  # EN: A TCXO board sets XOSC_START_ERR on every power-up as a matter of course:
  #     the chip tries to start its own crystal before DIO3 has been told to
  #     power the TCXO, and DIO3 is configured after reset. Clearing the flag
  #     once the reference is up is what the datasheet expects, and it is what
  #     turns the flag into a diagnostic: one that stays cleared was a power-on
  #     artefact, one that comes back after a clean clear is a reference that
  #     genuinely is not starting. Left off, the flag is always set on this board
  #     and therefore reports nothing at all.
  #     publish_dev_err_after_clear sends the re-read state to MQTT, which is the
  #     only way to see it on a node that receives nothing - and a node that
  #     receives nothing is exactly where the error register is the last thing
  #     left to read.
  # PL: Plytka z TCXO zapala XOSC_START_ERR przy kazdym starcie w sposob normalny:
  #     uklad probuje uruchomic wlasny kwarc, zanim DIO3 dostanie polecenie
  #     zasilenia TCXO, a DIO3 konfiguruje sie dopiero po resecie. Skasowanie
  #     flagi po ustawieniu referencji jest tym, czego oczekuje datasheet, i to
  #     dopiero czyni ja diagnostyczna: taka, ktora zostaje skasowana, byla
  #     artefaktem startu; taka, ktora wraca po czystym skasowaniu, to
  #     referencja, ktora naprawde nie startuje. Bez tego flaga jest na tej
  #     plytce zawsze zapalona i nie niesie zadnej informacji.
  #     publish_dev_err_after_clear wysyla ponownie odczytany stan na MQTT - to
  #     jedyny sposob, zeby zobaczyc go na wezle, ktory nic nie odbiera, a wlasnie
  #     tam rejestr bledow jest ostatnia rzecza, jaka zostala do odczytania.
  clear_device_errors_on_boot: true  # default: false
  publish_dev_err_after_clear: true  # default: false
  # rx_gain: boosted  # default: boosted
  # How many preamble bits the radio must see before it starts a reception.
  # 8 is what upstream uses and costs about 16% of the meters heard here; 16 is
  # the default and the maximum for listen_mode t1 and both, because the T1
  # preamble is shorter than 24 bits and 24 decodes nothing at all.
  # min_preamble_bits: 16  # default: 16
  # false is the right default. true switches the receive path to streaming and
  # costs about 7 dB in weak signal - measured off/on/off on one board, with
  # three untouched controls holding their RSSI percentile to the decibel.
  # Turn it on only if a meter here actually sends more than about 150 decoded
  # bytes: a three-phase electricity meter does, a water or heat meter does not.
  # Check your longest decoded frame before enabling it prophylactically.
  # long_gfsk_packets: false  # default: false

  # EN: Receive mode. Available values: t1, c1, both, s1.
  # PL: Tryb odbioru. Dostępne wartości: t1, c1, both, s1.
  listen_mode: t1
  # listen_mode_filter_after_parse: false  # default: false

  diagnostic_mode: normal
  # diagnostic_summary_interval: 60s  # default: 60s

  # EN: Publish the last measured RSSI for each forwarded meter as a retained
  #     integer at wmbus/<topic_name>/rssi/<meter_id>. Frames without a real
  #     RSSI measurement are skipped, so no placeholder value is ever sent.
  #     The wMBus MQTT Bridge add-on turns it into one signal-strength entity
  #     per receiving board, which is how two boards can be compared.
  # PL: Publikuj ostatnie zmierzone RSSI każdego przekazanego licznika jako
  #     zachowaną liczbę całkowitą na wmbus/<topic_name>/rssi/<meter_id>.
  #     Ramki bez rzeczywistego pomiaru są pomijane, więc żadna wartość
  #     zastępcza nie jest wysyłana. Dodatek wMBus MQTT Bridge robi z tego
  #     osobną encję siły sygnału dla każdej płytki, co pozwala je porównać.
  # publish_rssi: true  # default: false

  # EN: Optional whitelist — only these meters reach wmbus/<topic_name>/telegram.
  #     Everything else is dropped on the ESP, which is the point in a dense block.
  #     Use `forward_meters: true` instead of a list to reuse highlight_meters.
  #     Quote hex IDs, otherwise YAML turns 0x417F0666 into the number 1098843750.
  # PL: Opcjonalna whitelista — na wmbus/<topic_name>/telegram trafiają tylko te liczniki.
  #     Reszta jest odrzucana na ESP, o co chodzi w gęstej zabudowie.
  #     Zamiast listy można dać `forward_meters: true` i użyć listy z highlight_meters.
  #     ID szesnastkowe w cudzysłowie, inaczej YAML zamieni 0x417F0666 na 1098843750.
  # forward_meters:  # default: []
  #   - "00088888"
  #   - "0x417F0666"

  on_frame:
    then:
      - script.execute: blink_led
